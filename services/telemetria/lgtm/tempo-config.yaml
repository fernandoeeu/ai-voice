# Cópia do tempo-config.yaml do grafana/otel-lgtm 0.36.0, ajustada para um Mac pessoal (ver services/telemetria/compose.yaml).
server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks


# Tempo 3: a retenção fica no backend-worker.
backend_worker:
  compaction:
    block_retention: 72h
