name: Publish
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      # The version in package.json wins when it is ahead of the latest release
      # (a manual minor or major bump); otherwise the patch is bumped.
      - name: Pick the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          released=$(gh release view --json tagName --jq .tagName | sed 's/^v//')
          next=$(node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const ahead = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            console.log((ahead > 0 ? a : [b[0], b[1], b[2] + 1]).join("."));
          ' "$(node -p "require('./package.json').version")" "$released")
          npm version "$next" --no-git-tag-version --allow-same-version
          echo "version=$next" >> "$GITHUB_OUTPUT"
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer and no token.
      - run: npm install -g npm@latest
      - run: npm publish
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --generate-notes
